<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>cc-crew demo</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --fg: #e6e8ee; --dim: #8a93a6;
    --accent: #d97757; --chat: #f3f4f6; --bubble: #3370ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); }
  body { font-family: "Noto Sans SC", "Noto Color Emoji", sans-serif; color: var(--fg); position: relative; }
  .mono { font-family: "JetBrains Mono", "Noto Sans SC", "Noto Color Emoji", monospace; }

  /* 手机 */
  #phone { position: absolute; left: 48px; top: 18px; width: 372px; height: 684px; border-radius: 40px;
           background: #000; padding: 12px; box-shadow: 0 0 0 2px #2b303b, 0 20px 60px rgba(0,0,0,.5); }
  #screen { width: 100%; height: 100%; border-radius: 30px; overflow: hidden; background: var(--chat); position: relative; }
  #bar { height: 74px; background: #fff; border-bottom: 1px solid #e5e6eb; padding: 30px 16px 0; color: #1f2329; }
  #bar b { font-size: 15px; } #bar span { font-size: 11px; color: #8f959e; margin-left: 6px; }
  #pin { position: absolute; top: 76px; left: 8px; right: 8px; background: #fff; border-radius: 10px; padding: 7px 10px;
         font-size: 12px; color: #1f2329; box-shadow: 0 2px 8px rgba(0,0,0,.08); z-index: 3; }
  #pin small { color: #8f959e; }
  #feed { position: absolute; top: 118px; bottom: 54px; left: 0; right: 0; overflow: hidden; }
  #inner { position: absolute; left: 0; right: 0; padding: 0 10px 10px; }
  #input { position: absolute; bottom: 0; left: 0; right: 0; height: 54px; background: #fff; border-top: 1px solid #e5e6eb;
           padding: 9px 12px; }
  #input div { height: 36px; border-radius: 18px; background: #f2f3f5; padding: 0 14px; line-height: 36px; font-size: 13px; color: #1f2329; overflow: hidden; white-space: nowrap; }
  #input div.ph { color: #a0a6b0; }
  .row { display: flex; margin-top: 12px; }
  .row.me { justify-content: flex-end; }
  .ava { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 15px; margin-right: 7px;
         background: linear-gradient(135deg, #a78bfa, #7c3aed); }
  .who { font-size: 10.5px; color: #8f959e; margin-bottom: 3px; }
  .who i { font-style: normal; background: #fff3d6; color: #a46a00; border-radius: 3px; padding: 0 3px; margin-left: 3px; font-size: 9.5px; }
  .me .bub { background: var(--bubble); color: #fff; border-radius: 12px 2px 12px 12px; padding: 8px 11px; font-size: 13px; max-width: 250px; line-height: 1.5; }

  /* 卡片：和 cc-crew 新版卡片同一个结构——标题（工号 名字 · 状态 + 类型标签）、副标题（任务 目录）、
     说给它的话（浅底块 + 来源标签）、回答、一行小按钮（多的收进 ···）、一行底栏标签 */
  .card { width: 296px; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #e5e6eb; color: #1f2329; }
  .card .hd { padding: 8px 12px 7px; }
  .card .ttl { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; font-weight: 700; font-size: 13.5px; }
  .card .ttl span { line-height: 1.35; }
  .card .sub { font-size: 10.5px; color: #646a73; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kind { flex: none; font-style: normal; font-weight: 500; font-size: 9.5px; padding: 1px 5px; border-radius: 3px; background: rgba(31,35,41,.08); color: #4e5969; }
  .kind.cx { background: #eee5fc; color: #6425d0; }
  .card .bd { padding: 7px 12px 8px; font-size: 12px; line-height: 1.6; }
  .card .bd p { margin: 2px 0; white-space: pre-wrap; }
  .card .grey { color: #8f959e; }
  .card hr { border: 0; border-top: 1px solid #eef0f2; margin: 7px 0; }
  .tag { display: inline-block; font-style: normal; font-size: 9.5px; line-height: 15px; padding: 0 5px; border-radius: 3px; margin-right: 3px;
         background: #f2f3f5; color: #646a73; vertical-align: 1px; }
  .tag.blue { background: #e1eaff; color: #245bdb; } .tag.turq { background: #d5f6f2; color: #078372; }
  .tag.orange { background: #fee7cd; color: #c25705; } .tag.red { background: #fde2e2; color: #d1291f; } .tag.green { background: #d9f5d6; color: #237b19; }
  .q { border-radius: 6px; padding: 5px 8px; margin: 3px 0; font-size: 11.5px; line-height: 1.6; }
  .q.me { background: #eff4ff; } .q.peer { background: #eaf7ec; } .q.grey { background: #f5f6f7; }
  .q div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q .dot { color: #8f959e; margin-right: 4px; }
  .flow { font-size: 10.5px; color: #8f959e; line-height: 1.65; }
  .opt { background: #f5f6f7; border-radius: 6px; padding: 5px 8px; margin: 4px 0; }
  .opt pre { font-family: "JetBrains Mono", "Noto Sans SC", monospace; font-size: 10px; line-height: 1.35; color: #1f2329; margin-top: 3px; }
  .card .acts { display: flex; gap: 5px; margin-top: 7px; }
  .card .acts.bi .btn { flex: 1 1 0; }
  .btn { border: 1px solid #d0d3d6; border-radius: 5px; padding: 2px 8px; font-size: 11px; text-align: center; background: #fff; position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn.primary { border-color: #3370ff; color: #3370ff; }
  .btn.danger { border-color: #f54a45; color: #f54a45; }
  .btn.more { padding: 2px 7px; color: #646a73; letter-spacing: 1px; }
  .btn.hit { background: #e1eaff; }
  .card .note { font-size: 10px; color: #8f959e; margin-top: 7px; }
  .card .foot { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 3px; }
  .card .foot .tag { margin: 0; }
  .t-wathet .hd { background: #e1f3fb; color: #0b6aa8; } .t-green .hd { background: #e3f6e5; color: #1f7a33; }
  .t-orange .hd { background: #fdecdc; color: #b55a00; } .t-carmine .hd { background: #fde2e6; color: #b4142c; }
  .t-grey .hd { background: #eef0f2; color: #4e5969; } .t-blue .hd { background: #e1eaff; color: #1d4fd8; }
  .t-yellow .hd { background: #fdf5d6; color: #8a6d00; } .t-turquoise .hd { background: #d9f5f1; color: #0b7a6c; }
  #tap { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: rgba(51,112,255,.35);
         border: 2px solid rgba(51,112,255,.8); pointer-events: none; opacity: 0; z-index: 9; transform: translate(-50%,-50%); }

  /* 右边：说明 + 终端 */
  #cap { position: absolute; left: 470px; top: 26px; width: 770px; height: 108px; }
  #cap .zh { font-size: 30px; font-weight: 700; line-height: 1.25; }
  #cap .en { font-size: 15px; color: var(--dim); margin-top: 8px; }
  #cap .zh em { font-style: normal; color: var(--accent); }
  #grid { position: absolute; left: 470px; top: 150px; width: 770px; height: 548px; display: grid;
          grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .pane.flash { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(217,119,87,.35); }
  .pane .tt { font-size: 12px; padding: 6px 10px; background: #1d212a; color: var(--dim); display: flex; justify-content: space-between; align-items: center; }
  .pane .tt b { color: var(--fg); font-weight: 600; }
  .pane .tt i { font-style: normal; font-size: 10px; padding: 0 5px; border-radius: 3px; margin-left: 6px; background: #2a3040; color: #aab3c5; }
  .pane .tt i.cx { background: #3a2a5c; color: #c9b1ff; }
  .pane .tx { flex: 1; padding: 8px 10px; font-size: 11.5px; line-height: 1.55; white-space: pre-wrap; color: #cfd3dc; overflow: hidden;
              display: flex; flex-direction: column; justify-content: flex-end; }
  .tx .o { color: var(--accent); } .tx .g { color: #7ee2a8; } .tx .d { color: #6b7385; } .tx .y { color: #f2c94c; } .tx .b { color: #8ab4ff; }
  .tx .p { color: #c9b1ff; }
  .tx .box { border-top: 1px solid #2c3240; border-bottom: 1px solid #2c3240; margin-top: 5px; padding: 2px 0; }
  #end { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, #1d2230, #0b0d12); display: none; z-index: 20;
         flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #end h1 { font-size: 64px; letter-spacing: 1px; } #end h1 span { color: var(--accent); }
  #end p { font-size: 22px; color: var(--dim); margin-top: 10px; }
  #end code { display: inline-block; margin-top: 28px; font-size: 20px; background: #1a1e27; border: 1px solid #2b3140; padding: 12px 22px; border-radius: 10px; color: var(--fg); }
  #end .url { margin-top: 18px; font-size: 20px; color: #8ab4ff; }
</style>
</head>
<body>
<div id="phone"><div id="screen">
  <div id="bar"><b>我的 Claude 员工们</b><span>1 名成员 · 1 个机器人</span></div>
  <div id="pin">📌 <b>员工看板</b> <small>· 置顶</small></div>
  <div id="feed"><div id="inner"></div></div>
  <div id="input"><div class="ph" id="typing">发消息给 员工群</div></div>
</div><div id="tap"></div></div>

<div id="cap"><div class="zh" id="capzh"></div><div class="en" id="capen"></div></div>
<div id="grid"></div>
<div id="end"><h1>cc-<span>crew</span></h1><p>在飞书里当老板，管你电脑上的一群 Claude Code 和 Codex</p>
  <p style="font-size:17px">Be the boss of your Claude Code &amp; Codex crew, from your phone.</p>
  <code class="mono">git clone …/cc-crew &amp;&amp; python install.py</code><div class="url mono">github.com/Mutual-Luo/cc-crew</div></div>

<script>
// ---------------------------------------------------------------- 卡片
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const tag = (t, c = "") => `<i class="tag ${c}">${esc(t)}</i>`;
// c = {title, kind, sub, color, els: [...], foot: [标签…], time, live, hint}
// els：{q: [[来源, 颜色, 文字, 额外标签], …], tone} 说给它的话；{md}；{hr}；{flow: [行…]}；{acts: [[字, 样式, id]…], more}；
//      {pairs: [[字, 样式, id]…]}；{opts: [[编号, 名字, 说明, 预览]…]}；{note}
function cardHTML(c) {
  let h = `<div class="card t-${c.color}"><div class="hd"><div class="ttl"><span>${md(c.title)}</span>`
        + (c.kind ? `<i class="kind ${c.kind.startsWith("Codex") ? "cx" : ""}">${c.kind}</i>` : "") + "</div>"
        + (c.sub ? `<div class="sub">${esc(c.sub)}</div>` : "") + `</div><div class="bd">`;
  for (const e of c.els) {
    if (e.q) {
      let prev = null;
      h += `<div class="q ${e.tone || "me"}">` + e.q.map(([src, col, text, extra]) => {
        const same = src === prev; prev = src;
        return `<div>${same ? "<span class='dot'>·</span>" : src ? tag(src, col) : ""}${(extra || []).map(x => tag(x[0], x[1])).join("")}${md(text)}</div>`;
      }).join("") + "</div>";
    }
    else if (e.md !== undefined) h += `<p>${md(e.md)}</p>`;
    else if (e.hr) h += "<hr>";
    else if (e.flow) h += `<div class="flow">${e.flow.map(md).join("<br>")}</div>`;
    else if (e.acts) h += `<div class="acts">` + e.acts.map(([t, k, id]) => `<div class="btn ${k || ""}" ${id ? `id="${id}"` : ""}>${md(t)}</div>`).join("")
                        + (e.more ? `<div class="btn more">···</div>` : "") + "</div>";
    else if (e.pairs) for (let i = 0; i < e.pairs.length; i += 2) h += `<div class="acts bi">` + e.pairs.slice(i, i + 2).map(([t, k, id]) =>
                        `<div class="btn ${k || ""}" ${id ? `id="${id}"` : ""}>${md(t)}</div>`).join("") + "</div>";
    else if (e.opts) h += e.opts.map(([n, name, desc, pre]) => `<div class="opt"><b>${n}. ${esc(name)}</b><br><span class="grey">${esc(desc)}</span>`
                        + (pre ? `<pre>${esc(pre)}</pre>` : "") + "</div>").join("");
    else if (e.note) h += `<div class="note">${md(e.note)}</div>`;
  }
  if (c.hint) h += `<div class="note">${md(c.hint)}</div>`;
  h += `<div class="foot">` + (c.foot || []).map(t => Array.isArray(t) ? tag(t[0], t[1]) : tag(t)).join("")
     + tag(c.live ? "自动刷新 " + c.time : (c.time || "08:12")) + "</div>";
  return h + "</div></div>";
}
let seq = 0;
function botCard(c) {
  const id = "m" + (++seq);
  const row = document.createElement("div");
  row.className = "row"; row.id = id;
  row.innerHTML = `<div class="ava">⭐</div><div><div class="who">cc-crew<i>机器人</i></div>${cardHTML(c)}</div>`;
  inner.appendChild(row); follow(); return id;
}
function setCard(id, c) { document.querySelector(`#${id} .card`).outerHTML = cardHTML(c); follow(); }
function me(text) {
  const row = document.createElement("div");
  row.className = "row me"; row.innerHTML = `<div class="bub">${md(text)}</div>`;
  inner.appendChild(row); follow();
}

// 聊天区自动滚到底（平滑）
let scrollY = 0, scrollTo = 0;
function follow() { scrollTo = Math.min(0, feed.clientHeight - inner.scrollHeight); }
function tickScroll() { scrollY += (scrollTo - scrollY) * 0.25; inner.style.top = scrollY + "px"; requestAnimationFrame(tickScroll); }

// 点一下：蓝色圆圈 + 按钮变色
function tap(btnId) {
  const b = document.getElementById(btnId); if (!b) return;
  const r = b.getBoundingClientRect(), p = phone.getBoundingClientRect();
  tapEl.style.left = (r.left - p.left + r.width / 2) + "px"; tapEl.style.top = (r.top - p.top + r.height / 2) + "px";
  tapEl.style.opacity = 1; b.classList.add("hit");
  setTimeout(() => { tapEl.style.opacity = 0; }, 450);
}
// 手机上打字：一个字一个字出现，然后「发出」
function type(text, ms, done) {
  typing.className = ""; let i = 0;
  const step = () => { i++; typing.textContent = text.slice(0, i); if (i < text.length) setTimeout(step, ms); else setTimeout(() => {
    typing.className = "ph"; typing.textContent = "发消息给 员工群"; me(text); done && done(); }, 350); };
  step();
}
// 终端里打字：输入框里一个字一个字出现
function typeTerm(key, before, text, ms, done) {
  let i = 0;
  const step = () => { i++; term(key, before.concat([box(text.slice(0, i))])); if (i < text.length) setTimeout(step, ms); else done && setTimeout(done, 300); };
  step();
}
function caption(zh, en) { capzh.innerHTML = zh; capen.textContent = en; }

// ---------------------------------------------------------------- 右边四个终端（tmux 里真的 Claude Code / Codex）
const panes = {};
function pane(key, title, kind, sub) {
  const el = document.createElement("div"); el.className = "pane";
  el.innerHTML = `<div class="tt"><span><b>${title}</b><i class="${kind.startsWith("Codex") ? "cx" : ""}">${kind}</i></span><span>${sub}</span></div><div class="tx mono"></div>`;
  grid.appendChild(el); panes[key] = el; return el;
}
function term(key, lines) { panes[key].querySelector(".tx").innerHTML = "<div>" + lines.join("\n") + "</div>"; }
function flash(key) { const p = panes[key]; p.classList.add("flash"); setTimeout(() => p.classList.remove("flash"), 900); }
const box = (s = "") => `<div class="box">❯ ${s}</div>`;
const cbox = (s = "") => `<div class="box"><span class="p">›</span> ${s}</div>`;

// ---------------------------------------------------------------- 时间线
const T = []; const at = (s, f) => T.push([s * 1000, f]);
const CC = "CC", CX = "Codex·官方", OPUS = "Opus", GPT = "gpt-5-codex";
const board = (lines, extra = []) => ({ title: "员工看板", color: "wathet", els: [{ md: lines.join("\n") }, ...extra], foot: ["额度 12% / 31%"] });
const B1 = ["🟢 干活中　1号 CC **exp-baseline** · 跑基线", "🟢 干活中　2号 CC **paper** · 改论文第 4 节",
            "🙋 等你拍板　3号 Codex **cx-refactor**", "⏸ 空闲　CC **助手**（秘书）"];

at(0, () => {
  pane("p1", "1号 exp-baseline", CC, "~/proj/exp");
  pane("p2", "2号 paper", CC, "~/proj/paper");
  pane("p3", "3号 cx-refactor", CX, "~/proj/app");
  pane("p4", "助手（秘书）", CC, "~");
  term("p1", ["<span class='o'>●</span> Bash(python train.py --cfg base.yaml)", "  <span class='d'>⎿ epoch 3/20 · loss 0.412</span>", "<span class='o'>✻</span> Running… <span class='d'>(4m 12s)</span>", box()]);
  term("p2", ["<span class='o'>●</span> Read(sections/4-method.tex)", "<span class='o'>●</span> Update(sections/4-method.tex)", "  <span class='d'>⎿ 改了 6 行</span>", "<span class='o'>✻</span> Thinking… <span class='d'>(38s)</span>", box()]);
  term("p3", ["<span class='p'>•</span> 两种做法：", "  A. 先拆 service 层，再改接口", "  B. 先补测试，再一点点拆", "  C. 直接重写这个模块", "  你选哪个？", cbox()]);
  term("p4", ["<span class='d'>（空闲，等你吩咐）</span>", box()]);
  caption("3 个 Claude Code、1 个 Codex 在服务器上干活，<em>我在地铁上</em>", "Claude Code and Codex sessions working on my server. I'm on the subway.");
  window.bid = botCard(board(B1));
});
at(3.0, () => {
  caption("要我拍板的，<em>做成按钮</em>", "Decisions become buttons. Codex works the same way.");
  window.ask = botCard({ title: "3号 cx-refactor · 需要你拍板", kind: CX, sub: "重构支付模块　　~/proj/app", color: "carmine", els: [
    { md: "两种做法：\n**A.** 先拆 service 层，再改接口\n**B.** 先补测试，再一点点拆\n**C.** 直接重写这个模块\n你选哪个？" },
    { pairs: [["A. 先拆 service 层", "primary"], ["B. 先补测试", "primary", "bB"], ["C. 直接重写", "primary"], ["按你推荐的", ""]] },
    { acts: [["回复它", "primary"], ["看全文", ""]], more: 1 }], foot: [GPT, "上下文 41%"] });
});
at(5.0, () => tap("bB"));
at(5.5, () => {
  setCard(ask, { title: "3号 cx-refactor · 正在执行 · 3秒", kind: CX, sub: "重构支付模块　　~/proj/app", color: "wathet", live: 1, time: "08:13:05", els: [
    { q: [["你 · 飞书", "blue", "我选 B"]] }, { hr: 1 },
    { flow: ["读取　payment/service.py　1秒", "运行命令　pytest tests/payment -q　· 进行中"] },
    { acts: [["停止", "danger"], ["刷新", ""], ["看屏幕", ""]], more: 1 }], foot: [GPT, "上下文 42%"] });
  term("p3", ["<span class='b'>› 我选 B</span>", "<span class='p'>•</span> 好，先补测试。", "<span class='p'>•</span> Ran pytest tests/payment -q", "<span class='d'>  Working (3s · esc to interrupt)</span>", cbox()]);
  flash("p3");
  setCard(bid, board(["🟢 干活中　1号 CC **exp-baseline** · 跑基线", "🟢 干活中　2号 CC **paper** · 改论文第 4 节",
                      "🟢 干活中　3号 Codex **cx-refactor** · 先补测试", "⏸ 空闲　CC **助手**（秘书）"]));
});
at(7.8, () => {
  caption("要权限的，<em>点一下就允许</em>", "Permission prompts: Allow / Always / Deny.");
  term("p1", ["<span class='o'>●</span> Bash(python train.py --cfg base.yaml)", "  <span class='d'>⎿ 20/20 · acc 81.3</span>", "<span class='y'>Bash command</span>", "  pip install -U wandb", "<span class='y'>Do you want to proceed?</span>", "<span class='b'>❯ 1. Yes</span>", "  2. Yes, and don't ask again", "  3. No"]);
  window.perm = botCard({ title: "1号 exp-baseline · 要你批准", kind: CC, sub: "跑基线　　~/proj/exp", color: "yellow", els: [
    { md: "**它想运行命令**" }, { q: [["", "", "pip install -U wandb"]], tone: "grey" },
    { acts: [["允许", "primary", "bOK"], ["总是允许", ""], ["拒绝", "danger"]] },
    { acts: [["回复它", ""], ["看屏幕", ""]] }], hint: "拒绝后它会停下来，再告诉它改做什么" });
});
at(9.6, () => tap("bOK"));
at(10.1, () => {
